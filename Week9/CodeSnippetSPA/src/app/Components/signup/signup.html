<div class="page-container">
    <form class="card" style="max-width: 450px; margin: 0 auto;" [formGroup]="signupForm">
        <h2 style="margin-bottom: 1.5rem;">Create Account</h2>
        
        <div class="form-group">
            <input type="email" placeholder="Email Address" [formControl]="email" />
            @if(email.invalid && email.touched){
                <span class="error-text">Please enter a valid email</span>
            }
        </div>

        <div class="form-group">
            <input type="password" placeholder="Password" [formControl]="password" />
            @if(password.invalid && password.touched){
                <span class="error-text">Password must be at least 6 characters</span>
            }
        </div>

        <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
            <button class="btn btn-primary" style="flex: 1;" [disabled]="signupForm.invalid" (click)="register()">Register</button>
            <button type="button" class="btn btn-danger" (click)="reset()">Reset</button>
        </div>
    </form>
</div>
