<div class="max-w-3xl mx-auto my-12 px-6">
    <form class="bg-white rounded-xl shadow-md border border-slate-200 p-8" [formGroup]="createForm">
        <h2 class="text-3xl font-bold text-slate-900 mb-8">Create Snippet</h2>
        
        <div class="mb-6">
            <input type="text" placeholder="Snippet Title" [formControl]="title" 
                   class="w-full p-3 border border-slate-300 rounded-lg text-slate-800 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all font-medium" />
            @if(title.invalid && title.touched){
                <span class="text-red-500 text-sm mt-1.5 block font-medium">Title field cannot be empty</span>
            }
        </div>

        <div class="mb-6">
            <textarea placeholder="Paste your code here..." [formControl]="code"
                      class="w-full p-4 border border-slate-800 rounded-lg text-sm font-mono bg-slate-900 text-slate-100 min-h-[300px] focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition-all"></textarea>
            @if(code.invalid && code.touched){
                <span class="text-red-500 text-sm mt-1.5 block font-medium">Code field cannot be empty</span>
            }
        </div>

        <div class="flex justify-end mt-8">
            <button class="bg-indigo-600 text-white py-3 px-8 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-sm" 
                    [disabled]="createForm.invalid" (click)="save()">Save Snippet</button>
        </div>
    </form>
</div>
