<div class="max-w-5xl mx-auto my-12 px-6">
    <div class="mb-8">
        <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight">{{ codeSnippet().title }}</h2>
    </div>

    <app-snippet-box 
        [title]="codeSnippet().title" 
        [code]="codeSnippet().code"
        [isError]="codeSnippet().title === 'not found'">
    </app-snippet-box>
</div>
