<div class="max-w-5xl mx-auto my-12 px-6">
    <div class="flex flex-col gap-5">
        @if(isLoading()){
            <div class="text-center text-slate-500 mt-12 text-lg p-12 bg-white rounded-xl border border-dashed border-slate-300">
                Loading snippets... ⏳
            </div>
        } 
        @else if(items().length == 0){
            <div class="text-center text-slate-500 mt-12 text-lg p-12 bg-white rounded-xl border border-dashed border-slate-300">
                No Code Snippets found. Be the first to create one!
            </div>
        } 
        @else {
            @for(item of items(); track item.id){
                <div class="bg-white rounded-xl border border-slate-200 transition-all duration-200 hover:-translate-y-1 hover:shadow-lg hover:border-indigo-400">
                    <a [routerLink]="['/snippet', item.id]" class="block p-6 text-slate-800 font-semibold text-xl">
                        {{item.title}}
                    </a>
                </div>
            }
        }
    </div>
</div>
