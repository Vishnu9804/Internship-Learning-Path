<form class="container" [formGroup] = "loginForm">
    <h2>Login form</h2>
    <hr/>
    <br/>
    <input type="email" placeholder="Enter Email" [formControl] = "email" /><h5 class="red-text" [hidden]="email.valid || email.untouched">Enter Correct Email</h5>
    <input type="password" placeholder="Enter password" [formControl] = "password" /><h5 class="red-text" [hidden]="password.valid || password.untouched">password length must be minimum 6</h5>

    <button class="btn-green" [disabled] = "loginForm.invalid" (click)="login()">Login</button>
    <button class="btn-red" (click)="reset()">Reset</button>
</form>
