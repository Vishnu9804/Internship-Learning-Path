<div class="max-w-5xl mx-auto my-12 px-6">
    <form class="bg-white rounded-xl shadow-md border border-slate-200 p-8 max-w-md mx-auto" [formGroup]="loginForm">
        <h2 class="text-2xl font-bold text-slate-900 mb-6 text-center">Welcome Back</h2>
        
        <div class="mb-5">
            <input type="email" placeholder="Email Address" [formControl]="email" 
                   class="w-full p-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all" />
            @if(email.invalid && email.touched){
                <span class="text-red-500 text-sm mt-1.5 block">Please enter a valid email</span>
            }
        </div>

        <div class="mb-5">
            <input type="password" placeholder="Password" [formControl]="password" 
                   class="w-full p-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all" />
            @if(password.invalid && password.touched){
                <span class="text-red-500 text-sm mt-1.5 block">Password must be at least 6 characters</span>
            }
        </div>

        <div class="flex gap-3 mt-8">
            <button class="flex-1 bg-indigo-500 text-white py-2.5 px-4 rounded-lg font-semibold hover:bg-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed transition-all" 
                    [disabled]="loginForm.invalid" (click)="login()">Login</button>
            <button type="button" class="bg-red-500 text-white py-2.5 px-6 rounded-lg font-semibold hover:bg-red-600 transition-all" 
                    (click)="reset()">Reset</button>
        </div>
    </form>
</div>
