<div class="bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-800 w-full">
    <div class="bg-slate-800 px-4 py-3 flex justify-between items-center border-b border-slate-700">
        <div class="flex gap-2 items-center">
            <div class="w-3.5 h-3.5 rounded-full bg-red-500 shadow-sm"></div>
            <div class="w-3.5 h-3.5 rounded-full bg-yellow-500 shadow-sm"></div>
            <div class="w-3.5 h-3.5 rounded-full bg-green-500 shadow-sm"></div>
        </div>
        <div class="text-slate-400 text-xs font-mono">{{ title }}</div>
    </div>
    
    @if(isError){
        <div class="p-8 text-red-400 font-mono text-sm text-center bg-slate-900/50">
            ⚠ Error: Could not load code snippet or Snippet Not Found.
        </div>
    } @else {
        <pre class="p-6 overflow-x-auto"><code class="text-slate-300 font-mono text-sm leading-relaxed">{{ code }}</code></pre>
    }
</div>
