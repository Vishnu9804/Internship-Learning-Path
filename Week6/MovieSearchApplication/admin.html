<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Movie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h1>MovieAdmin</h1>
        <a href="index.html">Go to Search App</a>
    </nav>

    <div class="container">
        <h2>Add a New Movie</h2>
        <p style="color: #aaa; margin-bottom: 20px;">Data will be saved to your browser's LocalStorage.</p>
        
        <div class="form-group">
            <label>Movie Title</label>
            <input type="text" id="titleInput" placeholder="e.g. Inception" autocomplete="off">
        </div>
        
        <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="imageInput" placeholder="Paste an image link here" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="descInput" rows="4" placeholder="Brief info about the movie..."></textarea>
        </div>

        <button id="addBtn">Add Movie to Database</button>
        <p id="successMsg" class="success-msg">Movie added successfully!</p>

        <hr style="border: 1px solid #333; margin: 40px 0;">
        
        <h2 style="color: #ff4d4d;">Danger Zone</h2>
        <p style="color: #aaa; margin-bottom: 20px;">This will permanently delete all movies from your app.</p>
        
        <button id="clearBtn" style="background-color: #2a2a2a; border: 1px solid #444; color: #ff4d4d;">
            Clear All Movies
        </button>
    </div>

    <script src="admin.js"></script>
</body>
</html>
