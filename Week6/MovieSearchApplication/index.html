<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSearch | Movie App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1><span class="brand-red">Cine</span>Search</h1>
      <input type="text" id="search-input" placeholder="Search for famous movies..." autocomplete="off">
      <button id="view-watchlist-btn" class="outline-btn">My Watchlist</button>
    </div>
  </header>

  <main>
    <div id="loading" class="spinner" style="display: none;"></div>
    <div id="movie-grid" class="grid-container"></div>
    <div id="pagination" class="pagination-container"></div>
  </main>

  <div id="watchlist-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>My Watchlist</h2>
        <button id="close-watchlist" class="close-btn">&times;</button>
      </div>
      <div id="watchlist-items" class="watchlist-scroll-list">
        </div>
    </div>
  </div>

  <button id="back-to-top" title="Go to top">↑</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
