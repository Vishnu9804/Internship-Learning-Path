<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button><img src="https://cdn-icons-png.flaticon.com/512/10905/10905219.png" alt="search"></button>
        </div>

        <div class="error">
            <p>Invalid city name</p>
        </div>

        <div class="loader">Loading...</div>

        <div class="weather">
            <img src="https://openweathermap.org/img/wn/04d@2x.png" class="weather-icon">
            <h1 class="temp">22°c</h1>
            <h2 class="city">New York</h2>

            <div class="details">
                <div class="col">
                    <img src="https://cdn-icons-png.flaticon.com/512/7794/7794499.png">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
