<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">✓</span>
        <h2>TaskMaster</h2>
      </div>
      
      <div class="nav-section">
        <p class="nav-label">VIEWS</p>
        <button class="nav-btn active" data-filter="all">
          <span>All Tasks</span>
        </button>
        <button class="nav-btn" data-filter="active">
          <span>Active</span>
        </button>
        <button class="nav-btn" data-filter="completed">
          <span>Completed</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <div class="header-title-row">
          <div>
            <h1 id="view-title">All Tasks</h1>
            <p class="subtitle">Manage your daily workflow.</p>
          </div>
          
          <div class="category-dropdown">
            <button id="category-dropdown-btn" class="dropdown-btn">All Categories ▾</button>
            <ul id="category-dropdown-list" class="dropdown-list hidden">
              </ul>
          </div>
        </div>
      </header>
      
      <section class="input-section">
        <form id="todo-form" class="task-form">
          <input type="text" id="todo-input" placeholder="What needs to be done?" required>
          <input type="text" id="category-input" placeholder="Category">
          <input type="date" id="due-date-input" required title="Due Date">
          <button type="submit" class="btn-primary">Add Task</button>
        </form>
      </section>

      <section class="list-section">
        <ul id="todo-list"></ul>
        
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">📝</div>
          <h3>No tasks found</h3>
          <p>You're all caught up! Enjoy your day.</p>
        </div>
      </section>
    </main>

  </div>

  <script type="module" src="./dist/core/app.js"></script>
</body>
</html>
