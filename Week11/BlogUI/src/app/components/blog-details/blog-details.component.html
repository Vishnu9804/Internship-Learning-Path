<main class="container" *ngIf="post">
  <nav aria-label="Breadcrumb">
    <a routerLink="/" class="back-link">&larr; Back to all posts</a>
  </nav>
  
  <article class="article-content">
    <h1>{{ post.title }}</h1>
    <p class="date">Published on {{ post.date }}</p>
    <div class="content">
      {{ post.content }}
    </div>
  </article>
</main>

<main class="container" *ngIf="!post">
  <h1>Post not found</h1>
  <a routerLink="/">Return home</a>
</main>
