<main class="container">
  <nav aria-label="Breadcrumb">
    <a routerLink="/" class="back-link">&larr; Back to all posts</a>
  </nav>

  <article class="form-container">
    <h1>{{ isEditMode ? 'Edit Post' : 'Create New Post' }}</h1>
    
    <form (ngSubmit)="onSubmit()" #postForm="ngForm">
      <div class="form-group">
        <label for="title">Post Title</label>
        <input type="text" id="title" name="title" [(ngModel)]="postData.title" required aria-required="true" class="form-control">
      </div>

      <div class="form-group">
        <label for="summary">Short Summary</label>
        <input type="text" id="summary" name="summary" [(ngModel)]="postData.summary" required aria-required="true" class="form-control">
      </div>

      <div class="form-group">
        <label for="content">Full Content</label>
        <textarea id="content" name="content" rows="8" [(ngModel)]="postData.content" required aria-required="true" class="form-control"></textarea>
      </div>

      <button type="submit" class="submit-btn" [disabled]="!postForm.valid">
        {{ isEditMode ? 'Save Changes' : 'Publish Post' }}
      </button>
    </form>
  </article>
</main>
