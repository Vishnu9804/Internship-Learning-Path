<main class="app-container">
  <header>
    <h1>Task Manager - Core System</h1>
  </header>

  <section class="task-input-section">
    <input 
      type="text" 
      [value]="newTaskTitle()" 
      (input)="updateTitle($event)" 
      (keyup.enter)="submitTask()"
      placeholder="What needs to be done?"
      class="task-input"
    />
    <select [value]="newTaskPriority()" (change)="updatePriority($event)" class="priority-select">
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <button (click)="submitTask()" class="add-btn">Add Task</button>
  </section>

  <section class="task-list">
    @for (task of taskService.tasks(); track task.id) {
      <div class="task-item" [class.completed]="task.completed">
        <div class="task-content">
          <input type="checkbox" [checked]="task.completed" (change)="taskService.toggleTaskCompletion(task.id)">
          <div class="task-details">
            <span class="title">{{ task.title }}</span>
            <span class="priority-badge" [class]="task.priority.toLowerCase()">{{ task.priority }}</span>
          </div>
        </div>
        <button class="delete-btn" (click)="taskService.deleteTask(task.id)">Delete</button>
      </div>
    } @empty {
      <div class="empty-state">No tasks yet. Add one above!</div>
    }
  </section>
</main>
